<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="logo">
        <img src="img/ChatGPT Image 26 ago 2026, 12_27_02 p.m..png"
             alt="Logo"
             width="100"
             id="logo">
    </div>

    <div class="padre">

        <!-- INICIO DE SESIÓN -->
        <div class="hijo">

            <center>
                <h1>Inicio</h1>
            </center>

            <center>
                <form action="procesar.php" method="post">

                    <label for="username">Usuario:</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                    <br><br>

                    <label for="password">Contraseña:</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                    <br><br>

                    <input
                        type="submit"
                        value="Iniciar sesión"
                    >

                </form>
            </center>

        </div>


        <!-- REGISTRO -->
        <div class="hijo2">

            <center>
                <h1>Registro</h1>

                <label>Usuario:</label>

                <input
                    type="text"
                    id="usuarioRegistro"
                >

                <br><br>

                <label>Correo:</label>

                <input
                    type="email"
                    id="correoRegistro"
                >

                <br><br>

                <label>Contraseña:</label>

                <input
                    type="password"
                    id="contrasenaRegistro"
                >

                <br><br>

                <label>Confirmar contraseña:</label>

                <input
                    type="password"
                    id="confirmarRegistro"
                >

                <br><br>

                <button onclick="registrar()">
                    Registrarse
                </button>

            </center>

        </div>

    </div>


</body>

</html>
